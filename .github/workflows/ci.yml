name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        working-directory: mcps/telegram-mcp
        run: uv sync
      - name: Run tests
        working-directory: mcps/telegram-mcp
        run: uv run python -m pytest tests/ -v

  test-minecraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        working-directory: mcps/minecraft-mcp
        run: uv sync
      - name: Run tests
        working-directory: mcps/minecraft-mcp
        run: uv run python -m pytest tests/ -v
